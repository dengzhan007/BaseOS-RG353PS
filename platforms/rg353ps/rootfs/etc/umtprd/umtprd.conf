# BaseOS RG353PS MTP configuration for uMTP-Responder.
# Export only the mounted user-data filesystem, never a raw block device.
loop_on_disconnect 1
default_uid 0
default_gid 0
umask 022

storage "/mnt/SDCARD" "RG353PS" "rw"

manufacturer "BaseOS"
product "RG353PS"
serial "baseos-rg353ps"
firmware_version "1.0"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"
interface "MTP"
perceived_device_type 0x5

usb_vendor_id 0x2207
usb_product_id 0x0008
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x0100

usb_functionfs_mode 0x1
usb_dev_path "/dev/ffs-mtp/ep0"
usb_epin_path "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200

# Flush completed transfers before acknowledging completion to the host.
sync_when_close 0x1
