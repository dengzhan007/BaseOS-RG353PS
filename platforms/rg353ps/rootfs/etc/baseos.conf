# BaseOS RG353PS settings. Normal use requires no manual edits.
# Frontend discovery is generic: scan TF2 first, then TF1 user data.
# Install adapter packages on a user-data card root, not BASEOS_BOOT.
# Set frontend_id to an adapter ID to pin it; auto selects by manifest priority.
# This device node is the first TF2 probe; the selector also discovers alternatives.
frontend_device=/dev/mmcblk2p1
frontend_id=auto
# Troubleshooting only: yes bypasses discovery and shows the diagnostic UI.
force_diagnostic=no
# Persistent startup timing log on the user data card. The detailed timing
# remains available in /run for the current boot; enable this only when
# collecting boot-performance diagnostics.
boot_log=no
# Troubleshooting only: yes turns on verbose tracing everywhere it is offered.
#
# What it currently changes, in baseos-usb-storage:
#   - USB storage logs are mirrored to BASEOS_BOOT as they happen, and the five
#     most recent session logs are kept as rg353ps-usb-storage-<timestamp>.log.
#   - USB/PHY snapshots are taken before binding, three seconds after, and on
#     cable detection.
#   - A heartbeat every ten seconds dumps diskstats, pending SCSI commands and a
#     dmesg tail.
#
# With debug absent or no (the default) none of that runs. A storage session
# leaves nothing on the card unless it failed, in which case one trace is
# written at teardown. The card copy of this file wins over this one, so
# flipping it does not need a rebuild or an update.
debug=no

# USB composition policy. Development/test images default to SSH + MTP so
# automated debugging remains available while file-transfer behaviour is
# tested. Release builds select MTP-only defaults at build time.
# A card-side /mnt/SDCARD/baseos.conf entry overrides image defaults.
usb_profile=development
#
# ssh_debug enables USB RNDIS (default), NCM or ECM plus Dropbear SSH on
# 192.168.42.1:22, and also enables a separate Wi-Fi Dropbear shell on
# wlan0:2222 whenever Wi-Fi is connected. Wi-Fi SFTP on TCP/22 remains
# independent and works even when ssh_debug=no.
# The development profile permits the baked root password for debugging.
# Release builds default to MTP-only with both USB and Wi-Fi shell access off.
#
#     ssh -o StrictHostKeyChecking=no -i baseos-debug root@192.168.42.1
#     ssh root@192.168.42.1
#
# usb_mtp exposes only the already-mounted /mnt/SDCARD data filesystem. It does
# not export the raw block device, BASEOS_BOOT or BASEOS_ROOT partitions.
#
# With both switches enabled, network and MTP share one composite Gadget.
# Mass Storage remains exclusive and takes the UDC only after this gadget and
# its FunctionFS responder have stopped.
ssh_debug=yes
usb_mtp=yes

# Wi-Fi SFTP is independent of ssh_debug and is confined to /mnt/SDCARD.
wifi_sftp=yes

# Persistent USB failure reports on /mnt/SDCARD. This is independent of
# ssh_debug (network/SSH) and debug (verbose Mass Storage tracing). When enabled,
# controller probe snapshots and USB manager logs are saved after trouble.
# Default no keeps routine reconnect recovery from writing diagnostic files.
usb_diagnostics=no

# Wire protocol for that network: rndis (default) or ncm. Windows 10 ships the
# RNDIS driver, Windows 11 has been withdrawing it, and NCM is the one that
# newer Windows, Linux and macOS all bind on their own. Only the USB
# descriptors change; the address, DHCP and sshd are the same either way.
# usb_debug_mode=ncm

# Volume-key ownership: auto (default), frontend or system.
# auto follows the selected adapter manifest; older adapters default to system.
# frontend/system explicitly override the adapter declaration.
# The previous mixer value is restored when the frontend exits.
# volume_owner=system
