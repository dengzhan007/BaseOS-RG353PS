name: RG353PS USB storage mode checks

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "platforms/rg353ps/src/rg353ps-hotkeyd.c"
      - "assets/boot.ttf"
      - "src/fbsplash.c"
      - "platforms/rg353ps/rootfs/usr/bin/baseos-splash"
      - "platforms/rg353ps/build-image.sh"
      - "platforms/rg353ps/rootfs/etc/init.d/rcS"
      - "platforms/rg353ps/src/rg353ps-control-center.c"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-storage"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-debug"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-mtp"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-mode-lib"
      - "platforms/rg353ps/rootfs/etc/umtprd/umtprd.conf"
      - "platforms/rg353ps/USB.md"
      - "tests/test-rg353ps-usb-mtp.sh"
      - "tests/test-rg353ps-usb-mutual-exclusion.sh"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-session"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-discovery"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-manager"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-compat"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-paths"
      - "platforms/rg353ps/rootfs/usr/bin/baseos-splash"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-update"
      - "src/fbsplash.c"
      - "platforms/rg353ps/src/rg353ps-control-center.c"
      - "platforms/rg353ps/src/rg353ps-frontend-selector.c"
      - "tests/test-frontend-adapters.sh"
      - "tests/test-frontend-packages.sh"
      - "tests/test-frontend-manager.sh"
      - "tests/test-frontend-compat.sh"
      - "tests/test-frontend-paths.sh"
      - "tests/test-rg353ps-update-splash.sh"
      - "platforms/rg353ps/build-rootfs.sh"
      - "platforms/rg353ps/build-kernel.sh"
      - "overlay/usr/sbin/usb-gadget-adb"
      - ".github/workflows/rg353ps-storage-mode-check.yml"
  pull_request:
    paths:
      - "platforms/rg353ps/src/rg353ps-hotkeyd.c"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-storage"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-debug"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-mtp"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-usb-mode-lib"
      - "platforms/rg353ps/rootfs/etc/umtprd/umtprd.conf"
      - "platforms/rg353ps/USB.md"
      - "tests/test-rg353ps-usb-mtp.sh"
      - "tests/test-rg353ps-usb-mutual-exclusion.sh"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-session"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-discovery"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-manager"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-compat"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-paths"
      - "platforms/rg353ps/rootfs/usr/bin/baseos-splash"
      - "platforms/rg353ps/rootfs/usr/sbin/baseos-update"
      - "src/fbsplash.c"
      - "platforms/rg353ps/src/rg353ps-control-center.c"
      - "platforms/rg353ps/src/rg353ps-frontend-selector.c"
      - "tests/test-frontend-adapters.sh"
      - "tests/test-frontend-packages.sh"
      - "tests/test-frontend-manager.sh"
      - "tests/test-frontend-compat.sh"
      - "platforms/rg353ps/build-rootfs.sh"
      - "platforms/rg353ps/build-kernel.sh"
      - "overlay/usr/sbin/usb-gadget-adb"
      - ".github/workflows/rg353ps-storage-mode-check.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-usb-storage
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-usb-debug
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-usb-mtp
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-usb-mode-lib
          # This suite also invokes the 37-case mutual-exclusion/failure-path test.
          sh tests/test-rg353ps-usb-mtp.sh
          sh -n platforms/rg353ps/rootfs/etc/init.d/rcS
          sh -n platforms/rg353ps/rootfs/usr/bin/baseos-splash
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-session
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-discovery
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-manager
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-compat
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-paths
          sh tests/test-frontend-adapters.sh
          sh tests/test-frontend-packages.sh
          sh tests/test-frontend-manager.sh
          sh tests/test-frontend-compat.sh
          sh tests/test-frontend-paths.sh
          sh tests/test-rg353ps-update-splash.sh
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsyntax-only platforms/rg353ps/src/rg353ps-frontend-selector.c
          sh -n platforms/rg353ps/build-rootfs.sh
          sh -n platforms/rg353ps/build-kernel.sh
          sh -n overlay/usr/sbin/usb-gadget-adb
      - name: Check embedded Python build-edit scripts compile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("platforms/rg353ps/build-kernel.sh")
          source = path.read_text()
          blocks = re.findall(
              r"^[ \t]*python3 - <<PYCODE[ \t]*\n(.*?)^[ \t]*PYCODE[ \t]*$",
              source,
              re.MULTILINE | re.DOTALL,
          )
          if not blocks:
              raise SystemExit(f"No embedded Python blocks found in {path}")
          for index, block in enumerate(blocks, 1):
              compile(block, f"{path}:embedded-python-{index}", "exec")
          print(f"Validated {len(blocks)} embedded Python build-edit blocks")

      - name: Check hotkey daemon compiles cleanly
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror -fsyntax-only platforms/rg353ps/src/rg353ps-hotkeyd.c
