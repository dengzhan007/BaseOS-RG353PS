name: RG353PS release build

# Produces the complete card image and, for compatible versions, an A/B update payload.
# Version 1.2.8 remains a clean-flash-only migration; 1.2.9 restores update builds.
# The release workflow builds the complete BaseOS image and derives the A/B
# update payload from that exact image. The game frontend remains user-installed.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to attach the artifacts to (leave empty to keep them as workflow artifacts only)"
        required: false
        default: ""
      package_type:
        description: "Select which deliverable to build and publish"
        required: true
        type: choice
        options:
          - full
          - update
          - both
        default: both
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rg353ps-release.yml"
      - "src/fbsplash.c"
      - "platforms/rg353ps/build-*.sh"
      - "platforms/rg353ps/kernel/**"
      - "platforms/rg353ps/rootfs/**"
      - "platforms/rg353ps/src/**"
      - "platforms/rg353ps/frontends/**"
      - "tests/**"
      - "tools/common.sh"
      - "tools/make-bootlogo.sh"
      - "VERSION"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "release/**"
    paths:
      - ".github/workflows/rg353ps-release.yml"
      - "src/fbsplash.c"
      - "platforms/rg353ps/build-*.sh"
      - "platforms/rg353ps/kernel/**"
      - "platforms/rg353ps/rootfs/**"
      - "platforms/rg353ps/src/**"
      - "platforms/rg353ps/frontends/**"
      - "tests/**"
      - "tools/common.sh"
      - "VERSION"
      - "docs/RG353PS-RELEASE-1.2.7.md"
      - "docs/RG353PS-RELEASE-1.2.8.md"
      - "docs/RG353PS-RELEASE-1.2.9.md"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: rg353ps-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version="$(tr -d ' \n' < VERSION)"
          [ -n "$version" ] || { echo "VERSION is empty" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building BaseOS RG353PS $version"

      - name: Verify embedded OS version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          os_version="$(sed -n 's/^VERSION_ID="\([^"]*\)"$/\1/p' platforms/rg353ps/rootfs/etc/os-release)"
          [ -n "$os_version" ] || { echo "VERSION_ID missing from os-release" >&2; exit 1; }
          [ "$version" = "$os_version" ] || {
            echo "Version mismatch: VERSION=$version, os-release VERSION_ID=$os_version" >&2
            exit 1
          }
          echo "Version metadata verified: $version"

      - name: Enable ARM64 container emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Check shell syntax
        run: |
          sh -n tools/common.sh
          sh -n tools/make-bootlogo.sh
          sh -n platforms/rg353ps/build-uboot.sh
          sh -n platforms/rg353ps/build-firmware.sh
          sh -n platforms/rg353ps/build-kernel.sh
          sh -n platforms/rg353ps/build-rootfs.sh
          sh -n platforms/rg353ps/build-image.sh
          sh -n platforms/rg353ps/build-update.sh
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-update
          sh -n platforms/rg353ps/rootfs/etc/init.d/rcS
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-usb-debug
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-wifi-sftp
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-usb-mtp
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-session
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-manager
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-discovery
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-frontend-compat
          sh -n platforms/rg353ps/frontends/slot/launch.sh
          sh -n platforms/rg353ps/rootfs/usr/sbin/baseos-audio-init
          sh -n tests/test-frontend-manager.sh
          sh tests/test-frontend-adapters.sh
          sh tests/test-frontend-packages.sh
          sh tests/test-frontend-manager.sh
          sh tests/test-frontend-compat.sh
          sh tests/test-rg353ps-usb-mtp.sh
          sh tests/test-rg353ps-update-splash.sh

      - name: Build RG353PS U-Boot
        run: ./platforms/rg353ps/build-uboot.sh

      - name: Collect RTL8821CS firmware
        run: ./platforms/rg353ps/build-firmware.sh

      - name: Build RG353PS Linux kernel, DTB and modules
        run: ./platforms/rg353ps/build-kernel.sh

      - name: Build BaseOS rootfs and diagnostic fallback UI
        run: |
          case "$GITHUB_REF" in
            refs/heads/feature/*) profile=development ;;
            *) profile=release ;;
          esac
          echo "Building USB profile: $profile"
          BASEOS_USB_PROFILE="$profile" ./platforms/rg353ps/build-rootfs.sh

      - name: Assemble SD card image
        run: ./platforms/rg353ps/build-image.sh

      - name: Verify complete SD card image
        run: |
          image=work/rg353ps/baseos-rg353ps.img
          gzip -t "$image.gz"
          python3 - "$image" work/rg353ps/image-build.json <<'PY'
          import json, struct, sys
          from pathlib import Path
          image, metadata = map(Path, sys.argv[1:])
          assert image.stat().st_size == 2 * 1024**3, f"unexpected image size: {image.stat().st_size}"
          with image.open('rb') as f:
              f.seek(512)
              header = f.read(512)
              assert header[:8] == b'EFI PART', 'primary GPT signature missing'
              entries_lba = struct.unpack_from('<Q', header, 72)[0]
              count, entry_size = struct.unpack_from('<II', header, 80)
              f.seek(entries_lba * 512)
              table = f.read(count * entry_size)
          names = []
          for i in range(count):
              entry = table[i * entry_size:(i + 1) * entry_size]
              name = entry[56:128].decode('utf-16-le').rstrip(chr(0))
              if name:
                  names.append(name)
          required = {'BASEOS_UBOOT', 'BASEOS_BOOT', 'BASEOS_ROOT', 'BASEOS'}
          assert required.issubset(names), f"missing GPT partitions: {required - set(names)}"
          meta = json.loads(metadata.read_text())
          assert meta['purpose'] == 'RG353PS BaseOS system image'
          assert meta['frontend_model'].startswith('external;')
          assert meta['diagnostic_ui'] is True
          assert 'smoke' not in meta['image']
          print('Image verification passed:', ', '.join(names))
          PY

      # The update payload is derived from the composed image, so the image
      # remains an intermediate input even when only the update is published.
      # Version 1.2.8 changes the persisted SSH setting name without a
      # compatibility alias. It is a clean-flash migration and must not ship
      # an update package for earlier cards.
      - name: Build .bosupd update payload
        if: ${{ inputs.package_type != 'full' && steps.version.outputs.version != '1.2.8' }}
        run: ./platforms/rg353ps/build-update.sh

      - name: Verify .bosupd manifest
        if: ${{ inputs.package_type != 'full' && steps.version.outputs.version != '1.2.8' }}
        run: |
          python3 - work/rg353ps/baseos-rg353ps-${{ steps.version.outputs.version }}.bosupd "${{ steps.version.outputs.version }}" <<'PY'
          import sys, tarfile
          payload, version = sys.argv[1:]
          with tarfile.open(payload, 'r:') as archive:
              manifest = archive.extractfile('manifest').read().decode()
              members = set(archive.getnames())
          fields = dict(line.split('=', 1) for line in manifest.splitlines() if '=' in line)
          assert fields.get('format') == 'baseos-update/2'
          assert fields.get('target') == 'rg353ps'
          assert fields.get('version') == version
          assert {'boot.img.gz', 'rootfs.img.gz'}.issubset(members)
          assert fields.get('boot-sha256') and fields.get('rootfs-sha256')
          print('Update payload verification passed:', version, fields.get('build'))
          PY

      - name: Stage release files
        id: stage
        run: |
          version="${{ steps.version.outputs.version }}"
          case "$GITHUB_REF" in
            refs/heads/release/1.2.8) package_type=full ;;
            *) package_type="${{ inputs.package_type || 'both' }}" ;;
          esac
          # 1.2.8 is a full-image-only clean-flash migration.
          if [ "$version" = "1.2.8" ]; then package_type=full; fi
          work=work/rg353ps
          out=work/release
          mkdir -p "$out"
          files=""
          if [ "$package_type" = full ] || [ "$package_type" = both ]; then
            cp "$work/baseos-rg353ps.img.gz" "$out/baseos-rg353ps-$version.img.gz"
            files="$files baseos-rg353ps-$version.img.gz"
          fi
          if [ "$package_type" = update ] || [ "$package_type" = both ]; then
            cp "$work/baseos-rg353ps-$version.bosupd" "$out/baseos-rg353ps-$version.bosupd"
            files="$files baseos-rg353ps-$version.bosupd"
          fi
          # Checksums cover exactly the selected deliverables.
          ( cd "$out" && sha256sum $files > "baseos-rg353ps-$version.sha256" )
          {
            echo "version: $version"
            echo "commit: ${{ github.sha }}"
            echo "ref: ${{ github.ref_name }}"
            echo "kernel: $(python3 -c 'import json;print(json.load(open("work/rg353ps/kernel/output/kernel-build.json"))["kernel_release"])')"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$out/baseos-rg353ps-$version.build.txt"
          ls -l "$out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseos-rg353ps-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: work/release/*

      - name: Attach artifacts to a release
        if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'pull_request' && github.head_ref == 'release/1.2.6-rebuild') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if [ -n "${{ inputs.release_tag }}" ]; then
            tag="${{ inputs.release_tag }}"
          else
            case "$GITHUB_REF" in
              refs/tags/*) tag="$GITHUB_REF_NAME" ;;
              refs/heads/release/*) tag="$version" ;;
              *)
                if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "release/1.2.6-rebuild" ]; then
                  tag="$version"
                else
                  tag=""
                fi
                ;;
            esac
          fi
          if [ -n "$tag" ]; then
            if [ "$GITHUB_REF" = "refs/heads/release/1.2.8" ] && gh release view "$tag" >/dev/null 2>&1; then
              # 1.2.8 is a clean-flash-only release. Remove any update payload
              # left by an earlier queued workflow attempt before uploading.
              assets="$(gh release view "$tag" --json assets --jq '.assets[].name' | grep -E '\\.bosupd$' || true)"
              while IFS= read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --yes
              done <<EOF_ASSETS
          $assets
          EOF_ASSETS
            fi
            if [ "$GITHUB_REF" = "refs/heads/release/1.2.6-rebuild" ] || { [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_HEAD_REF" = "release/1.2.6-rebuild" ]; }; then
              gh release view "$tag" >/dev/null
              gh release upload "$tag" work/release/* --clobber
            elif gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" work/release/* --clobber
            else
              notes_file="docs/RG353PS-RELEASE-$version.md"
              if [ -f "$notes_file" ]; then
                gh release create "$tag" work/release/* --title "BaseOS RG353PS $version" --notes-file "$notes_file" --target "$GITHUB_SHA"
              else
                gh release create "$tag" work/release/* --title "BaseOS RG353PS $version" --notes "Complete image for $version." --target "$GITHUB_SHA"
              fi
            fi
            # Keep the published release description synchronized with the checked-in notes.
            notes_file="docs/RG353PS-RELEASE-$version.md"
            if [ -f "$notes_file" ] && gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "BaseOS RG353PS $version" --notes-file "$notes_file"
            fi
          fi
