name: Slot-6 RG353PS frontend build

on:
  workflow_dispatch:
  push:
    branches:
      - slot6-rg353ps-bringup
    paths:
      - "platforms/rg353ps/**"
      - ".github/workflows/slot6-rg353ps.yml"

permissions:
  contents: read

concurrency:
  group: slot6-rg353ps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend-only package (AArch64 musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out BaseOS-RG353PS
        uses: actions/checkout@v4
        with:
          path: baseos

      - name: Check out pinned private Slot-6 source
        uses: actions/checkout@v4
        with:
          repository: dengzhan007/slot-6
          ref: acc4e91708cc21abf2321a3af279aae1b2f26d47
          token: ${{ secrets.SLOT6_READ_TOKEN }}
          path: slot6-src

      - name: Set up QEMU for AArch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Slot-6 frontend package
        working-directory: baseos
        env:
          SLOT_SRC: ${{ github.workspace }}/slot6-src
          SLOT_REV: acc4e91708cc21abf2321a3af279aae1b2f26d47
        run: |
          sh ./platforms/rg353ps/build-slot.sh

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: baseos-rg353ps-slot-${{ github.run_number }}
          path: |
            baseos/work/rg353ps/frontends/baseos-rg353ps-slot.zip
            baseos/work/rg353ps/frontends/baseos-rg353ps-slot.zip.sha256
          if-no-files-found: error
          retention-days: 14
